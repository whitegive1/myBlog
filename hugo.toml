baseURL = "http://example.org/" # 部署时记得改成你的真实域名
title = "我的博客"
theme = "hugo-theme-stack"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[menu]
    [[menu.main]]
        identifier = "home"
        name = "首页"
        url = "/"
        weight = 1
        [menu.main.params]
            icon = "home"

    [[menu.main]]
        identifier = "archives"
        name = "归档"
        url = "/archives/"
        weight = 2
        [menu.main.params]
            icon = "tag"   # 已改为 tag

    [[menu.main]]
        identifier = "about"
        name = "关于"
        url = "/about/"
        weight = 3
        [menu.main.params]
            icon = "user"

    [[menu.social]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/你的用户名"
        [menu.social.params]
            icon = "brand-github"

[params]
    [params.sidebar]
        emoji = "👋"
        subtitle = "记录学习与生活"
        [params.sidebar.avatar]
            enabled = true
            local = true
            src = "img/avatar.png"

    [params.footer]
        since = 2024
        customText = ""

    # 日期格式修正版
    [params.dateFormat]
        published = "2006-01-02"
        lastUpdated = "2006-01-02 15:04 MST"

    # 文章设置修正版
    [params.article]
        math = false
        toc = true
        readingTime = true
        
        [params.article.license]
            enabled = false

    [params.comments]
        enabled = false
        provider = "giscus"

[markup.goldmark.renderer]
    unsafe = true

[markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    style = "monokai"
    tabWidth = 4